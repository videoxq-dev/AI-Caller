name: ai-caller

# Self-provisioning PostgreSQL + app migrations + Next.js web + worker.
# Automatically creates and persists private PostgreSQL if no external DATABASE_URL is set.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: ai-caller-app:deployos
  init: true
  env_file:
    - path: .env
      required: false

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_caller_auto_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ai_caller}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_caller"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      default:
        aliases:
          - postgres
          - ai-caller
          - aicaller

  migrate:
    <<: *app
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:ai_caller_auto_pass@postgres:5432/ai_caller}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-ec", "npm run verify:database-connection && npm run db:migrate && npm run verify:deployment"]

  web:
    <<: *app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:ai_caller_auto_pass@postgres:5432/ai_caller}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health', {signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    volumes:
      - recordings:/app/.data/recordings

  worker:
    <<: *app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:ai_caller_auto_pass@postgres:5432/ai_caller}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["sh", "-ec", "npm run verify:deployment && npm run worker"]
    volumes:
      - recordings:/app/.data/recordings

volumes:
  postgres_data:
  recordings:
