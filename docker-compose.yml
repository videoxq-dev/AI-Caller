name: ai-caller

# DeployOS app services use the EXISTING separately managed PostgreSQL database.
# DATABASE_URL must resolve from each container. This file never creates a new DB.
# To provision a brand-new all-in-one installation, use compose.selfhost.yaml.
# DO NOT switch an existing bundled database without a backed-up migration.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: ai-caller-app:deployos
  init: true
  env_file:
    - path: .env
      required: false

services:
  migrate:
    <<: *app
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the existing authenticated DeployOS DATABASE_URL on this app}
    command: ["sh", "-ec", "npm run verify:database-connection && npm run db:migrate && npm run verify:deployment"]

  web:
    <<: *app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOSTNAME: 0.0.0.0
      VOICE_RECORDING_ALLOW_PERSISTENT_FILESYSTEM: "true"
      VOICE_RECORDING_DIR: /app/.data/recordings
      DATABASE_URL: ${DATABASE_URL:?Set an authenticated DATABASE_URL with the postgres Docker host}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health', {signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    volumes:
      - recordings:/app/.data/recordings

  worker:
    <<: *app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set an authenticated DATABASE_URL with the postgres Docker host}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["sh", "-ec", "npm run verify:deployment && npm run worker"]
    volumes:
      - recordings:/app/.data/recordings


  gateway:
    <<: *app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VOICE_GATEWAY_PORT: "3002"
      DATABASE_URL: ${DATABASE_URL:?Set an authenticated DATABASE_URL with the postgres Docker host}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "voice-gateway"]
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health', {signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3

volumes:
  recordings:
