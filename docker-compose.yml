name: ai-caller

# Self-provisioning PostgreSQL + app migrations + Next.js web + worker.
# Automatically creates and persists private PostgreSQL if no external DATABASE_URL is set.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: ai-caller-app:deployos
  init: true
  env_file:
    - path: .env
      required: false

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set a database user in deployment secrets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong password in deployment secrets}
      POSTGRES_DB: ${POSTGRES_DB:?Set a database name in deployment secrets}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    # Existing trust-authenticated volumes must be backed up and upgraded by
    # the operator. Never delete data or silently change access controls.
    command:
      - sh
      - -ec
      - |
        if [ -f /var/lib/postgresql/data/pg_hba.conf ] &&
           grep -Eq '^[[:space:]]*host[^[:space:]]*[[:space:]].*[[:space:]](trust|md5|password)([[:space:]]|$)' /var/lib/postgresql/data/pg_hba.conf; then
          echo 'Legacy PostgreSQL host trust/md5/password authentication detected. Back up the volume and follow docs/postgres-auth-migration.md.' >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      default:
        aliases:
          - postgres
          - ai-caller
          - aicaller

  migrate:
    <<: *app
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set an authenticated DATABASE_URL with the postgres Docker host}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-ec", "npm run verify:database-connection && npm run db:migrate && npm run verify:deployment"]

  web:
    <<: *app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOSTNAME: 0.0.0.0
      VOICE_RECORDING_ALLOW_PERSISTENT_FILESYSTEM: "true"
      VOICE_RECORDING_DIR: /app/.data/recordings
      DATABASE_URL: ${DATABASE_URL:?Set an authenticated DATABASE_URL with the postgres Docker host}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health', {signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    volumes:
      - recordings:/app/.data/recordings

  worker:
    <<: *app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set an authenticated DATABASE_URL with the postgres Docker host}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["sh", "-ec", "npm run verify:deployment && npm run worker"]
    volumes:
      - recordings:/app/.data/recordings


  gateway:
    <<: *app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VOICE_GATEWAY_PORT: "3002"
      DATABASE_URL: ${DATABASE_URL:?Set an authenticated DATABASE_URL with the postgres Docker host}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "voice-gateway"]
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health', {signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:
  recordings:
