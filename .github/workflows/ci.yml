name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/issue-24-messaging-compliance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    name: Test, Typecheck, Build & Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_caller_test
      BETTER_AUTH_SECRET: ci-only-secret-change-me-please-1234567890
      BETTER_AUTH_URL: http://localhost:3000
      INTEGRATION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PG_BOSS_SCHEMA: pgboss
      LOG_LEVEL: silent
      AI_CALLER_E2E_FIXTURES: "1"
      AI_CALLER_BOOKING_V2: "enabled"
      HOSTED_TELNYX_API_KEY: ci-managed-telnyx-api-key
      HOSTED_TELNYX_WEBHOOK_PUBLIC_KEY: S5YG8mnUcwIiUkm8C8qHrHXRDMR0gIKJBNGj3GZyWb0=
      STRIPE_RESTRICTED_API_KEY: rk_test_ci_milestone10
      STRIPE_WEBHOOK_SECRET: whsec_ci_milestone10_signature_secret
      META_APP_SECRET: ci-meta-app-secret
      META_WEBHOOK_VERIFY_TOKEN: ci-meta-verify-token
      VOICE_GATEWAY_URL: ws://127.0.0.1:3002
      VOICE_GATEWAY_PORT: "3002"
      VOICE_RECORDING_STORAGE_BACKEND: filesystem
      VOICE_RECORDING_DIR: /tmp/ai-caller-recordings
      BRAND_ASSET_STORAGE_BACKEND: filesystem
      BRAND_ASSET_ALLOW_PERSISTENT_FILESYSTEM: "true"
      BRAND_ASSET_DIR: /tmp/ai-caller-brand-assets
      WHITELABEL_PUBLIC_IPV4: 203.0.113.25
      WHITELABEL_CANONICAL_HOST: app.aicaller.com

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_caller_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_caller_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run database migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Voice provider readiness unit tests (no network or secrets)
        run: npm run test:voice-readiness

      - name: Cloud deployment database probe unit tests
        run: npm run test:deployment

      - name: Database deployment readiness after migrations
        run: npm run verify:deployment

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate backwards-compatible DeployOS PostgreSQL volume and new database guard
        run: |
          # The existing DeployOS install uses its Compose postgres service;
          # an upgrade MUST NOT remove the service or its persistent volume.
          env -u POSTGRES_USER -u POSTGRES_PASSWORD -u POSTGRES_DB \
            docker compose -f docker-compose.yml config --quiet
          services=$(env -u POSTGRES_USER -u POSTGRES_PASSWORD -u POSTGRES_DB \
            docker compose -f docker-compose.yml config --services)
          for expected in postgres migrate web worker gateway; do
            printf '%s\n' "$services" | grep -qx "$expected"
          done
          docker compose -f docker-compose.yml config --volumes | grep -qx postgres_data
          docker compose -f docker-compose.yml config --volumes | grep -qx brand_assets
          # Gateway must survive redeploy on Traefik's edge network while
          # preserving its private default network for PostgreSQL.
          docker compose -f docker-compose.yml config --format json | node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(0, "utf8"));
            const gateway = config.services.gateway.networks;
            const web = config.services.web.networks;
            if (!config.networks.edge?.external || !gateway.default ||
                !gateway.edge?.aliases?.includes("aicaller-voice-gateway") ||
                !web.default || !web.edge?.aliases?.includes("aicaller-web") ||
                config.services.worker.networks?.edge ||
                config.services.postgres.networks.edge) process.exit(1);
          '
          grep -Fq 'POSTGRES_HOST_AUTH_METHOD: scram-sha-256' docker-compose.yml
          grep -Fq 'if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then' docker-compose.yml
          grep -Fq '"$$POSTGRES_PASSWORD" = "ai_caller_auto_pass"' docker-compose.yml
          if grep -Eq 'POSTGRES_HOST_AUTH_METHOD:[[:space:]]*trust|sed -i .*trust' docker-compose.yml; then
            echo 'Never initialize or silently rewrite PostgreSQL auth to trust.'
            exit 1
          fi
      - name: Validate read-only DeployOS database inventory preflight
        run: |
          sh -n scripts/inspect-deployos-postgres.sh
          node --test scripts/inspect-deployos-postgres.test.mjs
          sh -n scripts/inspect-deployos-traefik.sh

      - name: Verify existing PostgreSQL data survives a Compose upgrade
        run: sh scripts/verify-compose-postgres-compat.sh

      - name: Validate opt-in full-stack self-hosted Compose
        run: |
          cp .env.deploy.example .env.deploy
          docker compose --env-file .env.deploy -f compose.selfhost.yaml config --quiet
          rm .env.deploy

      - name: Build deployable app image and check runtime tooling
        run: |
          docker build --tag ai-caller-ci:latest .
          docker run --rm --entrypoint sh ai-caller-ci:latest -ec \
            'test -f .next/BUILD_ID && test -f db/migrations/0019_knowledge_sources.sql && test -x node_modules/.bin/tsx'

      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium

      - name: Start production app
        run: |
          npm start > /tmp/ai-caller-next.log 2>&1 &
          echo $! > /tmp/ai-caller-next.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ai-caller-next.log
          exit 1

      - name: Start background worker
        run: |
          npm run worker > /tmp/ai-caller-worker.log 2>&1 &
          echo $! > /tmp/ai-caller-worker.pid
          sleep 2
          if ! kill -0 "$(cat /tmp/ai-caller-worker.pid)" 2>/dev/null; then
            cat /tmp/ai-caller-worker.log
            exit 1
          fi

      - name: Start voice gateway
        run: |
          npm run voice-gateway > /tmp/ai-caller-voice.log 2>&1 &
          echo $! > /tmp/ai-caller-voice.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3002/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ai-caller-voice.log
          exit 1

      - name: Milestone 3 browser regression verification
        run: npm run test:browser

      - name: Milestone 4 browser acceptance verification
        run: npm run test:browser:m4

      - name: Milestone 5 SMS browser acceptance verification
        run: npm run test:browser:m5

      - name: Milestone 6 WhatsApp browser acceptance verification
        run: npm run test:browser:m6

      - name: Milestone 7 inbound voice browser acceptance verification
        run: npm run test:browser:m7

      - name: Milestone 8 collaboration and automations browser acceptance verification
        run: npm run test:browser:m8

      - name: Milestone 9 live dashboard browser acceptance verification
        run: npm run test:browser:m9

      - name: Milestone 10 billing and admin browser acceptance verification
        run: npm run test:browser:m10

      - name: Phase 1 AI Agent browser acceptance verification
        run: npm run test:browser:phase1

      - name: Agency workspace management browser acceptance verification
        run: npm run test:browser:agency

      - name: F12-C Whitelabel brand browser acceptance verification
        run: npm run test:browser:f12c

      - name: F12-D custom-domain DNS browser acceptance verification
        run: npm run test:browser:f12d-domain

      - name: Phase 4 Automation Builder browser acceptance verification
        run: npm run test:browser:phase4

      - name: Phase 6A WhatsApp template management browser acceptance verification
        run: npm run test:browser:phase6a

      - name: Provision Performance entitlement for Phase 6C test workspace
        id: phase6c_entitlement
        run: node scripts/ci-e2e-entitlement-grant.mjs install phase6c- PERFORMANCE

      - name: Phase 6C SMS automation readiness browser acceptance verification
        run: npm run test:browser:phase6c

      - name: Remove Phase 6C test entitlement provisioner
        if: always() && steps.phase6c_entitlement.outcome == 'success'
        run: node scripts/ci-e2e-entitlement-grant.mjs remove

      - name: Booking remediation browser acceptance verification
        run: npm run test:browser:booking

      - name: Upload F12-D custom-domain DNS screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f12d-domain-dns-verification
          path: artifacts/f12d-domain-dns
          if-no-files-found: warn
          retention-days: 14

      - name: Upload F12-C Whitelabel brand screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f12c-whitelabel-brand-verification
          path: artifacts/f12c-whitelabel-brand
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Agency workspace management screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agency-workspace-management-verification
          path: artifacts/agency-workspaces
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Phase 4 Automation Builder screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-automation-builder-verification
          path: artifacts/phase4-automation-builder
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Phase 6C SMS automation readiness screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6c-sms-automation-readiness
          path: artifacts/phase6c-sms-readiness
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Phase 6A WhatsApp template management screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6a-whatsapp-template-verification
          path: artifacts/phase6a-whatsapp-templates
          if-no-files-found: warn
          retention-days: 14

      - name: Upload booking remediation browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-remediation-browser-verification
          path: artifacts/booking-remediation
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Phase 1 AI Agent browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-agent-browser-verification
          path: artifacts/phase1-agent
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Milestone 3 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-domain-browser-verification
          path: artifacts/core-domain-browser
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Milestone 4 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone4-browser-verification
          path: artifacts/milestone4-browser
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Milestone 5 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone5-browser-verification
          path: artifacts/milestone5-browser
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Milestone 6 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone6-browser-verification
          path: artifacts/milestone6-browser
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Milestone 7 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone7-browser-verification
          path: artifacts/milestone7-browser
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Milestone 8 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone8-browser-verification
          path: artifacts/milestone8-browser
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Milestone 9 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone9-browser-verification
          path: artifacts/milestone9-browser
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Milestone 10 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone10-browser-verification
          path: artifacts/milestone10-browser
          if-no-files-found: warn
          retention-days: 14

      - name: Stop voice gateway
        if: always()
        run: |
          if [ -f /tmp/ai-caller-voice.pid ]; then
            kill "$(cat /tmp/ai-caller-voice.pid)" || true
          fi

      - name: Stop background worker
        if: always()
        run: |
          if [ -f /tmp/ai-caller-worker.pid ]; then
            kill "$(cat /tmp/ai-caller-worker.pid)" || true
          fi

      - name: Stop production app
        if: always()
        run: |
          if [ -f /tmp/ai-caller-next.pid ]; then
            kill "$(cat /tmp/ai-caller-next.pid)" || true
          fi

  telnyx_readonly:
    name: Telnyx read-only API smoke
    # Explicit operator-triggered live API check only; never expose the
    # protected Telnyx key to PRs or run carrier probes for every push.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: AI-Caller
    env:
      HOSTED_TELNYX_API_KEY: ${{ secrets.HOSTED_TELNYX_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Read-only Telnyx API verification
        run: node scripts/telnyx-readonly-smoke.mjs
