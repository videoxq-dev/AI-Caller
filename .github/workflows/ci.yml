name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, Typecheck, Build & Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_caller_test
      BETTER_AUTH_SECRET: ci-only-secret-change-me-please-1234567890
      BETTER_AUTH_URL: http://localhost:3000
      INTEGRATION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PG_BOSS_SCHEMA: pgboss
      LOG_LEVEL: silent

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_caller_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_caller_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run database migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium

      - name: Start production app
        run: |
          npm start > /tmp/ai-caller-next.log 2>&1 &
          echo $! > /tmp/ai-caller-next.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ai-caller-next.log
          exit 1

      - name: Browser smoke verification
        run: npm run test:browser

      - name: Upload browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-domain-browser-verification
          path: artifacts/core-domain-browser
          if-no-files-found: warn
          retention-days: 14

      - name: Stop production app
        if: always()
        run: |
          if [ -f /tmp/ai-caller-next.pid ]; then
            kill "$(cat /tmp/ai-caller-next.pid)" || true
          fi
